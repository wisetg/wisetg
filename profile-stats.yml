name: Update GitHub Profile Stats

on:
  workflow_dispatch:
  schedule:
    - cron: '17 1 * * *'
  push:
    paths:
      - '.github/workflows/profile-stats.yml'

permissions:
  contents: write

jobs:
  generate-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub Stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: 'username=wisetg&show_icons=true&hide_border=true&theme=transparent&rank_icon=github'
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate Most Used Languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: 'username=wisetg&layout=compact&langs_count=6&hide_border=true&theme=transparent'
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Commit generated cards
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add profile/stats.svg profile/top-langs.svg
          if git diff --cached --quiet; then
            echo 'Stats have not changed.'
            exit 0
          fi
          git commit -m 'chore: refresh profile stats [skip ci]'
          git push
